services:
  - type: web
    name: roll-initiative
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && cd client && npm install --include=dev && npm run build && cd ../server && npm install
    # Seed runs once per deploy, after build and before the new version goes
    # live — off the request path. A seed failure fails the deploy instead of
    # corrupting the live catalog mid-serve. The seed is self-cleaning (deletes
    # stale docs, guarded at 10%); run `npm run seed:monsters -- --dry-run`
    # before a deploy that follows large content deletions.
    preDeployCommand: cd server && npm run seed:monsters && npm run seed:spells
    startCommand: cd server && node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: APP_NAME
        value: Roll Initiative
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_MONTHLY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: VITE_POSTHOG_HOST
        sync: false
