version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "root"
    # Bundle all non-major bumps into a single PR per run; majors stay as
    # individual PRs so breaking upgrades get reviewed on their own.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # concurrently@10 requires Node >=22, but this project targets Node 20
    # (.node-version, engines, CI, Render). Ignore its major bumps until we
    # intentionally move the runtime to Node 22.
    ignore:
      - dependency-name: "concurrently"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "server"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "client"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
