<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Initiative Order — Player View</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="player.css" />
</head>
<body>

  <div class="player-wrapper">

    <!-- Header -->
    <header class="player-header">
      <h1 class="player-header__title">&#9876; Initiative Order</h1>
      <div class="player-header__round" id="player-round">Round 1</div>
    </header>

    <!-- Initiative List -->
    <main class="player-main" id="player-main">

      <!-- Waiting state (shown when no encounter has been started) -->
      <div class="player-waiting" id="player-waiting">
        <div class="player-waiting__icon">&#9876;</div>
        <div class="player-waiting__text">Waiting for encounter to begin...</div>
      </div>

      <!-- Initiative list (shown when combatants exist) -->
      <ol class="initiative-list hidden" id="initiative-list">
        <!-- Built dynamically by player.js -->
      </ol>

    </main>

    <!-- Footer -->
    <footer class="player-footer">
      <span>D&amp;D Initiative Tracker</span>
    </footer>

  </div>

  <script src="state.js"></script>
  <script src="player.js"></script>
</body>
</html>
