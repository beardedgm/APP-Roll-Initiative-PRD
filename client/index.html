<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Default title (overridden per-page by react-helmet-async) -->
    <title>Roll Initiative</title>

    <!-- Theme -->
    <meta name="theme-color" content="#1a1a2e" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7ZPVVRPSCM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Strip auth tokens from the URL before GA records page_location — reset /
      // verify links carry the token in the query string (finding f5). Param list
      // mirrors SENSITIVE_PARAMS in src/lib/redactUrl.js.
      (function () {
        try {
          var u = new URL(window.location.href);
          ['token', 'access_token', 'reset_token', 'verify_token'].forEach(function (p) {
            u.searchParams.delete(p);
          });
          var path = u.pathname + u.search + u.hash;
          gtag('config', 'G-7ZPVVRPSCM', { page_location: u.origin + path, page_path: path });
        } catch (e) {
          gtag('config', 'G-7ZPVVRPSCM');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
